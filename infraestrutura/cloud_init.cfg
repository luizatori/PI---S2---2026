#cloud-config
hostname: vm-gerador-hardware
manage_etc_hosts: true

users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: users, admin, sudo
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQ... (ssh-rsa  luiza.pincitori@sou.unifeob.edu.br)


package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - python3-venv
  - git
  - curl

runcmd:
  - echo "VM iniciada e configurada via cloud-init!" > /tmp/cloud-init-status.log